services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    network_mode: service:minecraft

  minecraft:
    image: itzg/minecraft-server:java25
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "1.21.11"
      MEMORY: "2G"
      ONLINE_MODE: "FALSE"
      COPY_CONFIG_DEST: /data
      SYNC_SKIP_NEWER_IN_DESTINATION: "false"
    ports:
      - "25565:25565"
    volumes:
      - minecraft-data:/data
      - ../build/libs:/plugins:ro
    tty: true
    stdin_open: true

volumes:
  minecraft-data:
