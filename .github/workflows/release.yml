name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0 or 1.0.0-SNAPSHOT)'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get version from tag or input
        id: version
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          if [ -z "$VERSION_INPUT" ]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$VERSION_INPUT
          fi
          VERSION_METADATA=$(bash scripts/validate-release-version.sh "$VERSION")
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "$VERSION_METADATA" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew check shadowJar --no-daemon -Pversion=${{ steps.version.outputs.VERSION }}

      - name: Verify embedded version
        run: |
          unzip -p "build/libs/DeathBanPro-${{ steps.version.outputs.VERSION }}.jar" plugin.yml |
            grep -Fx "version: ${{ steps.version.outputs.VERSION }}"

      - name: Rename JAR with version
        run: |
          mkdir -p build/release
          cp "build/libs/DeathBanPro-${{ steps.version.outputs.VERSION }}.jar" build/release/

      - name: Generate Changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md

      - name: Update CHANGELOG.md
        if: steps.git-cliff.outcome == 'success'
        run: |
          cat ${{ steps.git-cliff.outputs.changelog }} > CHANGELOG.md.tmp
          mv CHANGELOG.md.tmp CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/release/DeathBanPro-*.jar
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ steps.version.outputs.IS_PRERELEASE == '1' }}
          name: Release ${{ steps.version.outputs.VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
