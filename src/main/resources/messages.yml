# DeathBan Pro Messages
# Supports legacy color codes (&c, &a, etc.)
# Placeholders: {player}, {duration}, {offense_level}, {deaths}, {max}, {return_time}, {remaining}

prefix: "&8[&cDeathBan&8]&r "

ban:
  title: "&c&lYOU DIED"
  subtitle: "&7Banned for &e{duration}"
  kick-message: |
    &c&lDeath Ban
    
    &7You have been temporarily banned for dying.
    &7Duration: &e{duration}
    &7Offense Level: &c{offense_level}
    
    &7Return: &a{return_time}

return:
  title: "&a&lWELCOME BACK"
  subtitle: "&7Your ban has expired"
  message: "&aYou have returned from your death ban. Be careful!"

warnings:
  final-life: "&c&lWARNING: &7This is your final life! Next death = ban."
  near-limit: "&e&lCAUTION: &7{remaining} lives remaining in this period."

commands:
  help: |
    &6&lDeathBan Pro Commands
    &e/deathban check [player] &7- Check ban status
    &e/deathban reset <player> &7- Reset offense data
    &e/deathban pardon <player> &7- Remove active ban
    &e/deathban lives &7- Check shared lives pool
    &e/deathban lives add &7- Add a life to the pool
    &e/deathban reload &7- Reload configuration
  check-self: "&7Your offense level: &e{offense_level}&7, Deaths in window: &e{deaths}/{max}"
  check-other: "&7{player}'s offense level: &e{offense_level}&7, Deaths: &e{deaths}/{max}"
  check-banned: "&c{player} is currently banned. Returns: &e{return_time}"
  reset-success: "&aReset offense data for &e{player}"
  pardon-success: "&aPardoned &e{player}&a - they can rejoin now"
  pardon-not-banned: "&c{player} is not currently banned"
  pardon-notification: "&aYou have been pardoned by an admin. Welcome back!"
  reload-success: "&aConfiguration reloaded"

shared-lives:
  pool-status: "&7Shared Lives Pool &8(&e{pool}&8)&7: &a{lives}&7/&e{max}"
  life-added: "&aYou added a life to the pool! &7({lives}/{max})"
  life-consumed: "&cA life was consumed. &7Remaining: &e{lives}/{max}"
  pool-empty: "&c&lPOOL EMPTY! &7The shared lives pool is depleted."
  pool-full: "&cThe pool is already full ({max} lives)."
  no-pool: "&cYou are not in a shared lives pool."
  team-created: "&aTeam pool '&e{team}&a' created!"
  team-joined: "&aYou joined team '&e{team}&a'."
  team-left: "&eYou left your team pool."
  team-exists: "&cA team with that name already exists."
  team-not-found: "&cTeam not found: {team}"
  teams-disabled: "&cTeam pools are disabled on this server."
  kick-message: |
    &c&lDeath Ban

    &7The shared lives pool is empty!
    &7Duration: &e{duration}

    &7Return: &a{return_time}

theme:
  current: "&7Current theme: &e{theme}"
  available: "&7Available: &f{themes}"
  list-header: "&6&lAvailable Themes:"
  list-item: "&8- &e{id} &7({name} by {author}){active}"
  set-success: "&aTheme changed to: &e{theme}"
  not-found: "&cTheme not found: {id}"
  preview: "&7Previewing theme: &e{theme}"

errors:
  no-permission: "&cYou don't have permission to do that."
  player-not-found: "&cPlayer not found: {player}"
  invalid-usage: "&cUsage: {usage}"
  console-only-player: "&cThis command can only be used by players."
